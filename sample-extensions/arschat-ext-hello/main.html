<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hello Sample</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #ffffff;
    }
    body {
      margin: 0;
      padding: 16px;
    }
    main {
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    h1 {
      font-size: 20px;
      margin: 0;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: #4b5563;
    }
    textarea {
      min-height: 84px;
      resize: vertical;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px;
      font: inherit;
      color: #111827;
    }
    button {
      align-self: flex-start;
      border: 0;
      border-radius: 6px;
      padding: 7px 12px;
      background: #2563eb;
      color: #ffffff;
      font: inherit;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.55;
      cursor: default;
    }
    pre {
      min-height: 48px;
      margin: 0;
      padding: 8px;
      border-radius: 6px;
      background: #f3f4f6;
      color: #374151;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello Sample</h1>
    <label>
      Memo
      <textarea id="memo" placeholder="Saved in extension storage"></textarea>
    </label>
    <button id="save" type="button">Save Memo</button>
    <label>
      Message to AI
      <textarea id="message" placeholder="Ask ArsChat from this extension"></textarea>
    </label>
    <button id="send" type="button">Send to AI</button>
    <pre id="log">Ready</pre>
  </main>
  <script>
    const extId = 'arschat-ext-hello';
    let seq = 0;
    const pending = new Map();
    const log = document.getElementById('log');
    const memo = document.getElementById('memo');
    const message = document.getElementById('message');

    function request(method, params) {
      const requestId = String(++seq);
      window.parent.postMessage({ type: 'arschat-ext-request', extId, requestId, method, params }, '*');
      return new Promise((resolve, reject) => {
        pending.set(requestId, { resolve, reject });
        setTimeout(() => {
          if (pending.delete(requestId)) {
            reject(new Error('Request timed out'));
          }
        }, 30000);
      });
    }

    window.addEventListener('message', event => {
      const data = event.data;
      if (!data || data.type !== 'arschat-ext-response' || data.extId !== extId) {
        return;
      }
      const slot = pending.get(data.requestId);
      if (!slot) {
        return;
      }
      pending.delete(data.requestId);
      if (data.ok) {
        slot.resolve(data.result);
      } else {
        slot.reject(new Error(data.error ? data.error.message : 'Extension request failed'));
      }
    });

    async function boot() {
      try {
        const saved = await request('storage.get', { key: 'memo' });
        memo.value = typeof saved === 'string' ? saved : '';
        log.textContent = 'Loaded memo from extension storage.';
      } catch (e) {
        log.textContent = e.message;
      }
    }

    document.getElementById('save').addEventListener('click', async () => {
      try {
        await request('storage.set', { key: 'memo', value: memo.value });
        log.textContent = 'Memo saved.';
      } catch (e) {
        log.textContent = e.message;
      }
    });

    document.getElementById('send').addEventListener('click', async () => {
      try {
        await request('chat.send', { text: message.value || 'Hello from ArsChat extension.' });
        log.textContent = 'Message sent to ArsChat.';
      } catch (e) {
        log.textContent = e.message;
      }
    });

    boot();
  </script>
</body>
</html>
